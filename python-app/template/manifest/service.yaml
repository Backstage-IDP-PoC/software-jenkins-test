apiVersion: v1
kind: Service
metadata:
  name: ${{values.component_id}}
  namespace: ${{values.namespace}}
  labels:
    app: ${{values.component_id}}
    backstage.io/component: ${{values.component_id}}
spec:
  type: ClusterIP          # ← Never LoadBalancer; LB is shared
  selector:
    app: ${{values.component_id}}
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
